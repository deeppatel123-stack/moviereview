{% extends 'base.html' %}

{% block content %}

<form action="">
    <div class="mb-3">
        <label class="form-label">Search for Movie:</label>
        <input type="text" class="form-control" name="searchMovie" placeholder="Enter movie name" value="{{ searchTerm }}">
    </div>

    <button type="submit" class="btn btn-primary">Search</button>
</form>

<p>Searching for : {{ searchTerm }}</p>

<div class="row row-cols-1 row-cols-md-3 g-4">

    {% for movie in movies %}
    <div class="col">
        <div class="card h-100 shadow-sm">

            <img
                src="{{ movie.image.url }}"
                class="card-img-top"
                alt="{{ movie.title }}"
                style="
                    height: 400px;
                    width: 100%;
                    object-fit: contain;
                    background-color: #f8f9fa;
                    padding: 10px;
                "
            >

            <div class="card-body d-flex flex-column">

                <a href="{% url 'detail' movie.id %}" class="text-decoration-none text-dark">
                    <h5 class="card-title fw-bold">
                        {{ movie.title }}
                    </h5>
                </a>

                <p class="card-text">
                    {{ movie.description }}
                </p>

                {% if movie.url %}
                <a href="{{ movie.url }}" class="btn btn-primary mt-auto" target="_blank">
                    Movie Link
                </a>
                {% endif %}

            </div>

        </div>
    </div>
    {% endfor %}

</div>

<br>

<h2>Join our mailing list</h2>

<form action="{% url 'signup' %}">
    <div class="mb-3">
        <label class="form-label">Enter your email:</label>
        <input type="email" class="form-control" name="email" placeholder="Enter your email" required>
    </div>

    <button type="submit" class="btn btn-primary">Sign up</button>
</form>

{% endblock %}
