{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center py-5">
        <div class="col-md-7 col-lg-6 text-center">
                <div class="glass-card p-5 shadow-lg">
                        <div class="mb-3">
                                <i class="bi bi-patch-check-fill text-success"
                                        style="font-size: 5rem; text-shadow: 0 0 20px rgba(16, 185, 129, 0.4);"></i>
                        </div>
                        <h2 class="fw-bold text-glow mb-2">Awesome, You're Subscribed!</h2>
                        <p class="text-muted mb-4">We've added <strong>{{ email }}</strong> to our mailing list. Get
                                ready for exciting cinematic updates.</p>

                        <a href="{% url 'home' %}" class="btn btn-premium d-inline-flex align-items-center">
                                <i class="bi bi-compass me-2"></i>Explore Movies
                        </a>
                </div>
        </div>
</div>
{% endblock %}
