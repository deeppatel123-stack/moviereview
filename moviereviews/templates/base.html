<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineWave - Movie Reviews</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-4">
         <div class="container">
               <a class="navbar-brand" href="{% url 'home' %}">
                <i class="bi bi-film text-primary text-glow"></i> CineWave
               </a>
               <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                 <span class="navbar-toggler-icon"></span>
               </button>
               <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                     <div class="navbar-nav ms-auto align-items-center">
                          <a class="nav-link" href="{% url 'home' %}"><i class="bi bi-compass me-1"></i>Explore</a>
                          <a class="nav-link" href="{% url 'news' %}"><i class="bi bi-newspaper me-1"></i>News</a>
                          <a class="nav-link" href="{% url 'about' %}"><i class="bi bi-info-circle me-1"></i>About</a>

                          {% if user.is_authenticated %}
                          <a class="nav-link text-glow" href="{% url 'watchlist' %}">
                             <i class="bi bi-bookmark-heart text-danger me-1"></i>Watchlist
                          </a>
                          <div class="nav-item dropdown ms-2">
                              <a class="nav-link dropdown-toggle btn-premium-outline py-1 px-3 d-inline-flex align-items-center" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                  <i class="bi bi-person me-1"></i>{{ user.username }}
                              </a>
                              <ul class="dropdown-menu dropdown-menu-end bg-dark border-secondary mt-2 shadow" aria-labelledby="userDropdown">
                                  <li>
                                      <a class="dropdown-item text-light py-2" href="{% url 'logoutaccount' %}">
                                          <i class="bi bi-box-arrow-right me-2 text-danger"></i>Logout
                                      </a>
                                  </li>
                              </ul>
                          </div>
                          {% else %}
                          <a class="nav-link ms-2" href="{% url 'loginaccount' %}">Login</a>
                          <a class="nav-link ms-2 btn-premium text-white py-1 px-3" href="{% url 'signupaccount' %}">Sign Up</a>
                          {% endif %}
                     </div>
               </div>
         </div>
  </nav>

  <div class="container">
     <main style="min-height: 70vh;">
         {% block content %}
         {% endblock %}
     </main>

     <footer class="text-center text-lg-start border-top border-secondary mt-5 py-4 text-muted">
         <div class="d-flex flex-column flex-md-row justify-content-between align-items-center">
             <div class="mb-2 mb-md-0">
                 <span class="fw-bold text-glow">CineWave</span> &copy; 2026. Made with <i class="bi bi-heart-fill text-danger"></i>.
             </div>
             <div>
                 Developed by 
                 <a class="text-white text-decoration-none fw-semibold" rel="noopener noreferrer" target="_blank" href="https://github.com/tejasthakkar">
                     Deep Patel
                 </a>         
             </div>
         </div>
     </footer>
  </div>  
</body>
</html>
