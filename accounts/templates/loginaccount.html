{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-4 p-sm-5 shadow-lg">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock text-primary" style="font-size: 3rem;"></i>
                <h2 class="fw-bold text-glow mt-2">Welcome Back</h2>
                <p class="text-muted">Login to review and bookmark movies</p>
            </div>

            {% if error %}
            <div class="alert alert-danger border-danger bg-dark text-danger py-2 mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
            </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-premium py-2"><i
                            class="bi bi-box-arrow-in-right me-2"></i>Login</button>
                </div>
            </form>

            <div class="text-center mt-4">
                <p class="text-muted small m-0">Don't have an account? <a href="{% url 'signupaccount' %}"
                        class="text-primary text-decoration-none">Sign Up</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
